services:
  irs-simulation:
    image: ghcr.io/collaborativeroboticslab/industrial-robots-and-systems-warehouse:humble
    environment:
      - PYTHONUNBUFFERED=1                # GUI related
      - DISPLAY                           # GUI related
      - QT_X11_NO_MITSHM=1                # GUI related
      - NVIDIA_VISIBLE_DEVICES=all        # GUI related
      - NVIDIA_DRIVER_CAPABILITIES=all    # GUI related
      - ROS_DOMAIN_ID=0
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw    # GUI related

  irs-openplc-runtime:
    image: ghcr.io/collaborativeroboticslab/industrial-robots-and-systems-openplc-runtime:humble
    restart: unless-stopped
    network_mode: host

  omron_handsolo:
    container_name: omron_handsolo
    image: ghcr.io/collaborativeroboticslab/omron_handsolo:humble
    command: ros2 launch handsolo_ros handsolo.launch.py tm_use_simulation:=false use_rviz:=true use_moveit:=true use_nav2:=true
    environment:
      - PYTHONUNBUFFERED=1                # GUI related
      - DISPLAY                           # GUI related
      - QT_X11_NO_MITSHM=1                # GUI related
      - NVIDIA_VISIBLE_DEVICES=all        # GUI related
      - NVIDIA_DRIVER_CAPABILITIES=all    # GUI related
      - ROS_DOMAIN_ID=0
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw    # GUI related

  omron-workspace:
    image: ghcr.io/collaborativeroboticslab/omron-workspace:humble
    environment:
      - PYTHONUNBUFFERED=1                # GUI related
      - DISPLAY                           # GUI related
      - QT_X11_NO_MITSHM=1                # GUI related
      - NVIDIA_VISIBLE_DEVICES=all        # GUI related
      - NVIDIA_DRIVER_CAPABILITIES=all    # GUI related
      - ROS_DOMAIN_ID=0
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: host
    volumes:
      - /dev:/dev:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw                    # GUI related
      - ./workspace_data/workspace:/workspace:rw
      - ./workspace_data/code-server/config:/root/.config/code-server:rw
      - ./workspace_data/code-server/data:/root/.local/share/code-server:rw