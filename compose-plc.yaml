services:
  irs-openplc-runtime:
    container_name: openplc-runtime
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    restart: unless-stopped
    ports:
      - 8443:8443
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    volumes:
      - openplc-runtime-data:/var/run/runtime
      
  irs-openplc-editor:
    image: ghcr.io/collaborativeroboticslab/industrial-robots-and-systems-openplc-editor:jazzy
    ipc: host
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./openplc-editor/data:/editor_data:rw

volumes:
  openplc-runtime-data: